# Machines catalog — single source of truth.
#
# Every number that appears in a machines/ page table or figure lives HERE,
# with a source and a date. Pages and scripts/make_machine_figures.py read
# this file; nothing is hand-copied. Rules:
#
#   - Only numbers with a citable source. Approximations and vendor design
#     specs are flagged in the *_note field next to the number.
#   - null means "not published / not verified", never "zero".
#   - Errors are fractions (99.62% fidelity -> err 3.8e-03).
#   - Times in seconds (t1_s, t2_s, gate_2q_s) so modalities compare honestly.
#   - status: deployed | prototype | research | contested | announced | retired
#   - gate_based: false marks analog machines (annealers, Rydberg simulators,
#     boson samplers) whose "qubit" counts must NOT be compared to gate-model
#     qubit counts.
#
# Floats use the 1.0e-3 form (dot + signed exponent) so PyYAML parses them
# as numbers, not strings.

as_of: "2026-07"

modalities:
  superconducting: { label: "Superconducting", slot: 1 }
  trapped-ion:     { label: "Trapped ion",     slot: 2 }
  neutral-atom:    { label: "Neutral atom",    slot: 3 }
  photonic:        { label: "Photonic",        slot: 4 }
  spin:            { label: "Silicon spin",    slot: 5 }
  topological:     { label: "Topological",     slot: 6 }
  annealing:       { label: "Annealing",       slot: 7 }

machines:

